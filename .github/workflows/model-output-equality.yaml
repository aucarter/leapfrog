on:
  push:
    branches:
      - main
  pull_request:

name: model-output-equality

jobs:
  model-outputs:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Each entry exercises a distinct model-configuration shape so the
        # R/Python/C++ exact-equality check below catches adapter/marshalling
        # bugs a single fixture can't (ticket 18). The PJNZ file backing each
        # scenario is resolved by the "Select cross-interface fixture" step
        # via ticket 16's classifier tags, not hand-listed here -- see
        # leapfrog-validate/src/leapfrog_validate/select_fixtures.py.
        scenario: [baseline, coarse, pmtct_child]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - name: Generate C++ headers
        uses: ./.github/actions/setup

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: "https://mrc-ide.r-universe.dev https://hivtools.r-universe.dev"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::here
          needs: check
          working-directory: leapfrogr

      - name: Create test data
        shell: bash
        run: ./scripts/create_test_data.R
        working-directory: .

      - name: Install R Package
        shell: bash
        working-directory: leapfrogr
        run: |
          R CMD INSTALL .

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            leapfrog-py/uv.lock
            leapfrog-validate/uv.lock

      - name: Select cross-interface fixture
        id: select
        shell: bash
        working-directory: leapfrog-validate
        run: |
          uv sync
          r_library="$(Rscript -e 'cat(.libPaths()[1])')"
          uv run python -m leapfrog_validate.select_fixtures "${{ matrix.scenario }}" --r-library "$r_library" >> "$GITHUB_OUTPUT"

      - name: R Model Output
        shell: bash
        working-directory: leapfrogr
        run: |
          ./scripts/create_model_output.R "${{ steps.select.outputs.PARAMS_H5 }}" "${{ steps.select.outputs.CONFIGURATION }}" ../model-outputs

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install the project
        shell: bash
        working-directory: leapfrog-py
        run: uv sync --all-extras --dev

      - name: Py Model Output
        shell: bash
        working-directory: leapfrog-py
        run: |
          uv run ./scripts/create_model_output.py "${{ steps.select.outputs.PARAMS_H5 }}" "${{ steps.select.outputs.CONFIGURATION }}" ../model-outputs

      - name: Install hdf5 and compile standalone model
        shell: bash
        working-directory: cpp_interface
        run: |
          sudo apt-get install libhdf5-dev
          cmake -B build .
          cmake --build build

      - name: Cpp Model Output
        shell: bash
        working-directory: cpp_interface
        run: |
          ./build/simulate_model 61 "../leapfrogr/tests/testthat/testdata/${{ steps.select.outputs.PARAMS_H5 }}" ../model-outputs "${{ steps.select.outputs.CONFIGURATION }}"

      - name: Check equality
        shell: bash
        working-directory: model-outputs
        run: |
          sudo apt install hdf5-tools
          h5diff output.h5 r-output.h5
          h5diff output.h5 py-output.h5
